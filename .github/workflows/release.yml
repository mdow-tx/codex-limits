name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: swift test

      - name: Package app
        run: ./scripts/package-local.sh

      - name: Rename release asset
        run: |
          cp "dist/Codex Limits.zip" "dist/Codex-Limits-${{ steps.version.outputs.tag }}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_ASSET: dist/Codex-Limits-${{ steps.version.outputs.tag }}.zip
        run: |
          notes=$(cat <<'EOF'
          Download the zip, unzip it, and move `Codex Limits.app` to Applications.

          This build is ad hoc signed for local use. Until Developer ID signing and notarization are configured, macOS may require right-clicking the app and choosing Open the first time.
          EOF
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Codex Limits $RELEASE_TAG" --notes "$notes"
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
              --title "Codex Limits $RELEASE_TAG" \
              --notes "$notes"
          fi
